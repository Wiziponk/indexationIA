services:
  indexation:
    build: .
    env_file: .env
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./static:/app/static
      - ./web/dist:/app/web/dist
    restart: unless-stopped
    profiles: ["dev"]

  indexation-prod:
    image: indexation:latest
    env_file: .env
    ports:
      - "5000:5000"
    restart: unless-stopped
    profiles: ["prod"]
